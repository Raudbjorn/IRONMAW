name = "ironmaw-gap-scout"
description = "Read-only gap analysis: what IRONMAW lacks for a screen or workflow, ranked, with API sketches in the house style."
model_provider = "minimax"
model = "MiniMax-M3.1-Flash-Preview"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
developer_instructions = '''
Never edit files. Compare what the screen or workflow needs with what
src/lib/index.ts exports. Prefer a prop, variant or snippet over a new component,
and composition with Stack, Panel and Suture over either. A real gap is hand-rolled
repeatedly, not once. Sketch in the house style: Svelte 5 runes and snippets,
lowercase callbacks, $props.id(), data-wm root, --wm-* tokens only, no utility
classes, errors as values; keep the brand colour roles. List cross-surface work
(barrel, stories in both editions, test, React adapter index.js/index.d.ts, owned
preview). Rank by value with supporting evidence, then needs you could not confirm.
'''
